name: Kira Systems
description: Kira Systems is a machine-learning contract analysis and review platform for law firms and
  corporate legal teams, automatically extracting clauses, concepts, and data points from contracts during
  M&A due diligence, real estate, banking, and other transactional work. Founded in Toronto and backed by
  Insight Partners, Kira was acquired by Litera in 2021 and is now offered as Litera Kira. It integrates
  with HighQ and Intralinks data rooms and Litera Transact, and exposes an Open API for additional customer
  integration needs; no public developer portal or OpenAPI specification is currently published.
